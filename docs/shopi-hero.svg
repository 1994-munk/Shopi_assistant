<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Shopi product showcase with grocery AI interface and shopping basket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="50%" stop-color="#f3fff6"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)" rx="28"/>

  <circle cx="1020" cy="120" r="170" fill="#dff7ee"/>
  <circle cx="230" cy="520" r="210" fill="#e9f2ff"/>

  <g filter="url(#shadow)">
    <rect x="72" y="84" width="1056" height="470" rx="28" fill="#ffffff"/>
  </g>

  <rect x="96" y="106" width="1008" height="68" rx="18" fill="#f8fafc"/>
  <rect x="116" y="126" width="42" height="42" rx="12" fill="url(#panel)"/>
  <text x="137" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700">S</text>
  <text x="178" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="#0f172a" font-weight="700">Shopi</text>
  <text x="178" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">AI grocery shopping assistant</text>

  <g>
    <rect x="102" y="210" width="420" height="84" rx="22" fill="#0f766e"/>
    <text x="132" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#ffffff">“Show me vegan snacks under $5”</text>
    <circle cx="480" cy="252" r="8" fill="#9ae6b4"/>
  </g>

  <g>
    <rect x="102" y="318" width="392" height="92" rx="22" fill="#ecfdf5"/>
    <text x="126" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#065f46" font-weight="600">Here are a few healthy picks.</text>
    <text x="126" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f766e">Fresh, budget-friendly, and in-stock</text>
  </g>

  <g>
    <rect x="548" y="210" width="500" height="148" rx="22" fill="url(#card)" stroke="#dbeafe"/>
    <rect x="572" y="234" width="150" height="98" rx="18" fill="#eff6ff"/>
    <rect x="586" y="248" width="122" height="16" rx="8" fill="#bfdbfe"/>
    <rect x="586" y="276" width="92" height="12" rx="6" fill="#dbeafe"/>
    <rect x="586" y="296" width="74" height="12" rx="6" fill="#dbeafe"/>
    <text x="748" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#0f172a" font-weight="700">Roasted Chickpeas</text>
    <text x="748" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f766e" font-weight="700">$3.49</text>
    <text x="748" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Crunchy · Vegan · Snack favorite</text>
  </g>

  <g>
    <rect x="548" y="382" width="500" height="126" rx="22" fill="#f8fafc" stroke="#dfe7f1"/>
    <text x="572" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#64748b">Basket summary</text>
    <text x="572" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700">Total: $3.49</text>
    <text x="896" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="700">1 item</text>
    <rect x="914" y="470" width="96" height="22" rx="11" fill="#dff7ee"/>
    <text x="962" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#065f46" font-weight="700">Secure</text>
  </g>

  <g>
    <circle cx="1140" cy="150" r="20" fill="#fef3c7"/>
    <circle cx="1080" cy="118" r="12" fill="#d1fae5"/>
    <circle cx="1032" cy="180" r="10" fill="#dbeafe"/>
    <text x="746" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700">Conversational commerce</text>
    <text x="746" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">stateful basket • safety checks • live-ready architecture</text>
  </g>
</svg>
