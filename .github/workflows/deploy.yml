name: Deploy Shopi Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate backend compilation
        run: python -m compileall backend

  deploy:
    name: Deploy to production environment
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "Production deployment step is intentionally kept simple and readable."
          echo "Replace this with your actual deployment target such as Railway, Render, Azure App Service, or a container registry workflow."
